<div class="p-6 space-y-6">
  <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
    <div
      *ngFor="let metric of metrics"
      class="bg-white rounded-2xl shadow p-4 flex items-center"
    >
      <div class="w-30 h-20 mr-4 flex-shrink-0">
        <img
          [src]="metric.iconPath"
          [alt]="metric.title"
          class="w-16 h-18 rounded-2xl object-contain"
          style=""
        />
      </div>

      <div class="flex-grow min-w-0">
        <p class="text-sm text-gray-500 truncate">{{ metric.title }}</p>
        <h2 class="text-2xl font-bold">{{ metric.value }}</h2>
        <p *ngIf="metric.description" class="text-green-500 text-xs">
          {{ metric.description }}
        </p>
      </div>
    </div>
  </div>

  <div class="grid grid-cols-1 lg:grid-cols-3 gap-4">
    <div class="bg-white rounded-2xl shadow p-4 lg:col-span-2">
      <div class="flex space-x-2 mb-4">
        <button
          (click)="switchTab('revenue')"
          [class]="
            activeTab === 'revenue'
              ? 'bg-[#130A26] text-white'
              : 'bg-[#4830781A] text-gray-700'
          "
          class="text-sm font-medium px-4 py-2 rounded-lg transition-all"
        >
          Revenue
        </button>
        <button
          (click)="switchTab('teachers')"
          [class]="
            activeTab === 'teachers'
              ? 'bg-[#130A26] text-white'
              : 'bg-[#4830781A] text-gray-700'
          "
          class="text-sm font-medium px-4 py-2 rounded-lg transition-all"
        >
          Teachers
        </button>
        <button
          (click)="switchTab('students')"
          [class]="
            activeTab === 'students'
              ? 'bg-[#130A26] text-white'
              : 'bg-[#4830781A] text-gray-700'
          "
          class="text-sm font-medium px-4 py-2 rounded-lg transition-all"
        >
          Students
        </button>
      </div>

      <div class="h-64">
        <canvas
          baseChart
          [data]="lineChartData"
          [options]="lineChartOptions"
          [type]="lineChartType"
        >
        </canvas>
      </div>
      <div class="text-sm mt-2">
        Set Daily Reminder<br />
        <span class="text-xs text-gray-400"
          >Reminder after you reached daily limit</span
        >
      </div>
    </div>

    <!-- Calendar (unchanged) -->
    <div class="bg-white rounded-2xl shadow p-4">
      <div class="flex justify-between items-center mb-4">
        <h3 class="text-xl font-bold">School Calendar</h3>
        <div class="flex space-x-2">
          <button
            (click)="prevMonth()"
            class="p-1 rounded-full hover:bg-gray-100"
          >
            <svg
              xmlns="http://www.w3.org/2000/svg"
              class="h-5 w-5"
              viewBox="0 0 20 20"
              fill="currentColor"
            >
              <path
                fill-rule="evenodd"
                d="M12.707 5.293a1 1 0 010 1.414L9.414 10l3.293 3.293a1 1 0 01-1.414 1.414l-4-4a1 1 0 010-1.414l4-4a1 1 0 011.414 0z"
                clip-rule="evenodd"
              />
            </svg>
          </button>
          <button
            (click)="nextMonth()"
            class="p-1 rounded-full hover:bg-gray-100"
          >
            <svg
              xmlns="http://www.w3.org/2000/svg"
              class="h-5 w-5"
              viewBox="0 0 20 20"
              fill="currentColor"
            >
              <path
                fill-rule="evenodd"
                d="M7.293 14.707a1 1 0 010-1.414L10.586 10 7.293 6.707a1 1 0 011.414-1.414l4 4a1 1 0 010 1.414l-4 4a1 1 0 01-1.414 0z"
                clip-rule="evenodd"
              />
            </svg>
          </button>
        </div>
      </div>
      <div class="text-center font-semibold mb-2">{{ currentMonthYear }}</div>
      <div class="grid grid-cols-7 gap-1 text-center text-sm">
        <div *ngFor="let day of weekDays" class="font-bold py-1">{{ day }}</div>
        <div
          *ngFor="let date of calendarDays"
          [class.text-red-500]="date.isWeekend && date.isCurrentMonth"
          [class.text-gray-400]="!date.isCurrentMonth"
          [class.font-bold]="date.isToday"
          [class.bg-blue-100]="date.isToday"
          class="p-2 rounded-full"
        >
          {{ date.day }}
        </div>
      </div>
    </div>
  </div>

  <div class="bg-white rounded-2xl shadow p-4">
    <h3
      class="bg-[#130A26] text-lg text-white p-3 font-semibold mb-4 rounded-[12px]"
    >
      Announcement
    </h3>
    <div class="divide-y">
      <div *ngFor="let item of announcements" class="py-2">
        <div class="text-xs font-semibold">{{ item.date }}</div>
        <div class="text-sm">{{ item.message }}</div>
      </div>
    </div>
  </div>
</div>
