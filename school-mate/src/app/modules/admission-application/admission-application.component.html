<h3 class="text-xl font-bold text-gray-800 mb-4">Admission Applications</h3>
<div
  class="bg-white shadow rounded-xl p-6 overflow-hidden overflow-y-auto mb-3"
>
  <h3 class="text-xl text-gray-800 mb-4">Select Criteria</h3>
  <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-4 mb-4">
    <div>
      <!-- <label class="block text-gray-700 mb-1" for="dateFrom">Certificate</label> -->
      <select
      id="source"
      class="w-full border border-gray-300 rounded-lg px-3 py-2 focus:outline-none focus:ring-2 focus:ring-indigo-500"
      
    >
      <option value="">Session</option>
      <option value="year_one">2019/2020</option>
      <option value="year_two">2020/2021</option>
      <option value="year_three">2021/2022</option>
    </select>
    </div>

    <div>
      <!-- <label class="block text-gray-700 mb-1" for="dateTo"
        >Header Left Text</label
      > -->
      <select
      id="source"
      class="w-full border border-gray-300 rounded-lg px-3 py-2 focus:outline-none focus:ring-2 focus:ring-indigo-500"
      
    >
      <option value="">Application Status</option>
    </select>
    </div>

    <div>
        <!-- <label class="block text-gray-700 mb-1" for="dateTo"
          >Header Left Text</label
        > -->
        <select
        id="source"
        class="w-full border border-gray-300 rounded-lg px-3 py-2 focus:outline-none focus:ring-2 focus:ring-indigo-500"
        
      >
        <option value="">Application Number</option>
      </select>
      </div>
    <div>
      <!-- <label class="block text-gray-700 mb-1" for="dateTo">Date</label> -->
      <input
        id="date"
        type="date"
        class="w-full border border-gray-300 rounded-lg px-3 py-2 focus:outline-none focus:ring-2 focus:ring-indigo-500"
        
      />
    </div>
  </div>
  <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-4 mb-4">


    <div class="flex items-end">
      <button
        class="w-24 bg-[#483078] text-white font-medium text-sm px-4 py-2 rounded hover:bg-[#331b64] transition"
      >
        Search
      </button>
    </div>
  </div>
</div>
<div class="bg-white shadow rounded-xl p-6 overflow-hidden overflow-y-auto">
  <app-shared-table
    [tableData]="admission"
    [columns]="tableColumns"
    [showActionBtn]="showActionBtn"
    (actionRow)="goToDetails($event)"
    [tableTitle]="'Admission List'"
  ></app-shared-table>
</div>
