<h3 class="text-xl font-bold text-gray-800 mb-4">Admission Query</h3>
<div class="bg-white p-6 overflow-hidden overflow-y-auto mb-3 rounded-2xl shadow-md">
    <h3 class="text-xl text-gray-800 mb-4">Select Criteria</h3>
    <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-4">
        <!-- Date from -->
        <div>
          <label class="block text-gray-700 mb-1" for="dateFrom">Date from</label>
          <input 
            id="dateFrom" 
            type="date" 
            class="w-full border border-gray-300 rounded-lg px-3 py-2 focus:outline-none focus:ring-2 focus:ring-indigo-500"
            [(ngModel)]="criteria.dateFrom"
          />
        </div>
    
        <!-- Date to -->
        <div>
          <label class="block text-gray-700 mb-1" for="dateTo">Date to</label>
          <input 
            id="dateTo" 
            type="date" 
            class="w-full border border-gray-300 rounded-lg px-3 py-2 focus:outline-none focus:ring-2 focus:ring-indigo-500"
            [(ngModel)]="criteria.dateTo"
          />
        </div>
    
        <div>
          <label class="block text-gray-700 mb-1" for="source">Select Source</label>
          <select 
            id="source" 
            class="w-full border border-gray-300 rounded-lg px-3 py-2 focus:outline-none focus:ring-2 focus:ring-indigo-500"
            [(ngModel)]="criteria.source"
          >
            <option value="">Select Source</option>
            <option value="Chem.">Chem.</option>
            <option value="Physics">Physics</option>
            <option value="Biology">Biology</option>
          </select>
        </div>
    
        <!-- Select Status -->
        <div>
          <label class="block text-gray-700 mb-1" for="status">Select Status</label>
          <select 
            id="status" 
            class="w-full border border-gray-300 rounded-lg px-3 py-2 focus:outline-none focus:ring-2 focus:ring-indigo-500"
            [(ngModel)]="criteria.status"
          >
            <option value="">Select Status</option>
            <option value="Open">Open</option>
            <option value="Closed">Closed</option>
            <option value="Pending">Pending</option>
          </select>
        </div>
      </div>
</div>
<div class="bg-white shadow rounded-xl p-6 overflow-hidden overflow-y-auto">
  <app-shared-table [tableData]="adminQuery" [columns]="tableColumns" [showActionBtn]="showActionBtn"
    ></app-shared-table
  >
</div>
