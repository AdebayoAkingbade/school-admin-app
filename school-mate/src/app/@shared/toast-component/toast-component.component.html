<div class="fixed top-4 right-4 z-50 space-y-2 w-full max-w-xs">
    <div
            *ngFor="let toast of toasts"
            [ngClass]="{
          'bg-green-700 border-green-200': toast.type === 'success',
          'bg-red-500 border-red-500': toast.type === 'error',
          'bg-amber-500 border-amber-500': toast.type === 'warning',
          'bg-blue-400 border-blue-400': toast.type === 'info'
        }"
            class="border rounded-md p-3 flex items-center gap-2 shadow-sm animate-fadeIn transition-all duration-300"
    >
        <!-- Success Icon - Simplified -->
        <span *ngIf="toast.type === 'success'"
              class="flex items-center justify-center w-5 h-5 rounded-full bg-green-100">
            <svg class="w-3 h-3 text-green-600" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M5 13l4 4L19 7"/>
            </svg>
        </span>

        <!-- Error Icon - Simplified -->
        <span *ngIf="toast.type === 'error'" class="flex items-center justify-center w-5 h-5 rounded-full bg-red-100">
            <svg class="w-3 h-3 text-red-600" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M6 18L18 6M6 6l12 12"/>
            </svg>
        </span>

        <!-- Warning Icon - Triangle -->
        <span *ngIf="toast.type === 'warning'" class="flex items-center justify-center w-5 h-5 rounded-full bg-amber-100">
            <svg class="w-3 h-3 text-amber-600" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                      d="M12 9v2m0 4h.01M12 3l-8.01 14h16L12 3z"/>
            </svg>
        </span>

        <!-- Info Icon - Proper "i" -->
        <span *ngIf="toast.type === 'info'" class="flex items-center justify-center w-5 h-5 rounded-full bg-blue-100">
            <svg class="w-3 h-3 text-blue-600" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <circle cx="12" cy="12" r="10" stroke-width="2"/>
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 16v-4m0-4h.01"/>
            </svg>
        </span>

        <div
                [ngClass]="
                'text-white'
            "
                class="text-xs font-bold flex-1"
        >
            {{ toast.message }}
        </div>

    </div>
</div>
